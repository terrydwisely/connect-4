<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Four — ChatGPT 5.5 Edition</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111a30;
      --panel-soft: #1a2544;
      --line: #2d3b66;
      --text: #e8f0ff;
      --muted: #9fb2d9;
      --accent: #42d392;
      --p1: #ffd166;
      --p2: #ef476f;
      --win: #7ee081;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 90% -20%, #223d7c 0%, transparent 60%),
        radial-gradient(900px 600px at -10% 110%, #224b50 0%, transparent 60%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(950px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)), var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 30px 60px var(--shadow);
      overflow: hidden;
    }

    header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    h1 {
      font-size: clamp(1.15rem, 2vw, 1.5rem);
      margin: 0;
      font-weight: 700;
    }

    .badge {
      font-size: 0.78rem;
      color: #041e11;
      background: var(--accent);
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0;
    }

    .panel {
      padding: 18px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,0.01);
    }

    .section-title {
      margin: 0 0 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: .75rem;
      font-weight: 700;
    }

    .card {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 0;
    }

    .muted { color: var(--muted); font-size: .9rem; }

    select, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0f1730;
      color: var(--text);
      padding: 8px 10px;
    }

    button {
      cursor: pointer;
      background: linear-gradient(180deg, #1a2a53, #122040);
      width: 100%;
      margin-top: 8px;
      font-weight: 600;
    }

    button:hover { filter: brightness(1.08); }

    .game {
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .status {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 600;
    }

    .scores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .score {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #101a33;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
    }

    .board-wrap {
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .board {
      width: fit-content;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(7, 72px);
      gap: 8px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #27406e, #1d3155);
    }

    .cell {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 25%, #c8d7ff, #8ea6d8);
      cursor: pointer;
      transition: transform .12s ease;
      box-shadow: inset 0 -6px 10px rgba(0,0,0,.22);
      font-size: 32px;
    }

    .cell:hover { transform: translateY(-2px); }
    .cell.p1 { background: radial-gradient(circle at 30% 25%, #ffeab3, var(--p1)); }
    .cell.p2 { background: radial-gradient(circle at 30% 25%, #ffb2c4, var(--p2)); }
    .cell.win { outline: 4px solid var(--win); outline-offset: -3px; }
    .cell:disabled { cursor: default; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .panel { border-right: 0; border-bottom: 1px solid var(--line); }
    }

    @media (max-width: 520px) {
      .board { grid-template-columns: repeat(7, 48px); gap: 6px; }
      .cell { width: 48px; height: 48px; font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Connect Four</h1>
      <span class="badge">Rebuilt with ChatGPT 5.5 workflow</span>
    </header>

    <div class="layout">
      <aside class="panel">
        <p class="section-title">Game Mode</p>
        <div class="card">
          <div class="row">
            <label for="mode">Opponent</label>
            <select id="mode">
              <option value="human">Human vs Human</option>
              <option value="ai">Human vs ChatGPT 5.5 Bot</option>
            </select>
          </div>
          <div class="row" id="difficulty-row" style="display:none;">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
        </div>

        <p class="section-title">Actions</p>
        <div class="card">
          <button id="new-game">New Game</button>
          <button id="reset-scores">Reset Scores</button>
        </div>

        <p class="section-title">Tips</p>
        <div class="card muted">
          Drop 4 in a row to win. The bot prioritizes win/block moves, then center control and future setup.
        </div>
      </aside>

      <section class="game">
        <div class="status" id="status">Player 1's turn.</div>

        <div class="scores">
          <div class="score"><span>🟡 Player 1</span><span id="score-p1">0</span></div>
          <div class="score"><span>🔴 Player 2</span><span id="score-p2">0</span></div>
        </div>

        <div class="board-wrap">
          <div class="board" id="board" aria-label="Connect Four board"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const ROWS = 6;
    const COLS = 7;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const modeEl = document.getElementById('mode');
    const difficultyEl = document.getElementById('difficulty');
    const difficultyRowEl = document.getElementById('difficulty-row');
    const scoreP1El = document.getElementById('score-p1');
    const scoreP2El = document.getElementById('score-p2');

    let grid;
    let currentPlayer;
    let gameOver;
    let scores = { p1: 0, p2: 0 };

    function resetBoard() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      currentPlayer = 'p1';
      gameOver = false;
      render();
      updateStatus("Player 1's turn.");

      if (isAiTurn()) {
        queueAiMove();
      }
    }

    function render() {
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('button');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          const value = grid[r][c];

          if (value === 'p1') cell.classList.add('p1');
          if (value === 'p2') cell.classList.add('p2');

          cell.disabled = !!value || gameOver || isAiTurn();
          cell.setAttribute('aria-label', `Row ${r + 1}, Column ${c + 1}`);
          cell.addEventListener('click', () => makeMove(c));
          boardEl.appendChild(cell);
        }
      }
    }

    function updateStatus(msg) {
      statusEl.textContent = msg;
    }

    function getOpenRow(col, state = grid) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!state[r][col]) return r;
      }
      return -1;
    }

    function availableCols(state = grid) {
      const cols = [];
      for (let c = 0; c < COLS; c++) {
        if (getOpenRow(c, state) !== -1) cols.push(c);
      }
      return cols;
    }

    function makeMove(col) {
      if (gameOver) return;
      const row = getOpenRow(col);
      if (row === -1) return;

      grid[row][col] = currentPlayer;
      const winLine = getWinningLine(row, col, currentPlayer, grid);
      if (winLine) {
        finishGame(currentPlayer, winLine);
        return;
      }

      if (isBoardFull(grid)) {
        gameOver = true;
        updateStatus("It's a draw.");
        render();
        return;
      }

      currentPlayer = currentPlayer === 'p1' ? 'p2' : 'p1';
      render();
      updateStatus(currentPlayer === 'p1' ? "Player 1's turn." : modeEl.value === 'ai' ? "ChatGPT 5.5 Bot is thinking…" : "Player 2's turn.");

      if (isAiTurn()) {
        queueAiMove();
      }
    }

    function finishGame(player, winLine) {
      gameOver = true;
      scores[player]++;
      scoreP1El.textContent = scores.p1;
      scoreP2El.textContent = scores.p2;
      render();

      winLine.forEach(([r, c]) => {
        const el = boardEl.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
        if (el) el.classList.add('win');
      });

      if (player === 'p1') {
        updateStatus('🟡 Player 1 wins!');
      } else {
        updateStatus(modeEl.value === 'ai' ? '🔴 ChatGPT 5.5 Bot wins!' : '🔴 Player 2 wins!');
      }
    }

    function isBoardFull(state) {
      return state.every(row => row.every(Boolean));
    }

    function getWinningLine(row, col, player, state) {
      const dirs = [[0,1], [1,0], [1,1], [1,-1]];
      for (const [dr, dc] of dirs) {
        const line = [[row, col]];

        let r = row + dr, c = col + dc;
        while (inBounds(r, c) && state[r][c] === player) {
          line.push([r, c]);
          r += dr;
          c += dc;
        }

        r = row - dr; c = col - dc;
        while (inBounds(r, c) && state[r][c] === player) {
          line.unshift([r, c]);
          r -= dr;
          c -= dc;
        }

        if (line.length >= 4) return line;
      }
      return null;
    }

    function inBounds(r, c) {
      return r >= 0 && r < ROWS && c >= 0 && c < COLS;
    }

    function cloneGrid(state) {
      return state.map(row => [...row]);
    }

    function isAiTurn() {
      return modeEl.value === 'ai' && currentPlayer === 'p2' && !gameOver;
    }

    function queueAiMove() {
      render();
      setTimeout(() => {
        const col = chooseAiColumn();
        makeMove(col);
      }, 300);
    }

    function chooseAiColumn() {
      const cols = availableCols();
      const difficulty = difficultyEl.value;

      if (difficulty === 'easy') {
        return cols[Math.floor(Math.random() * cols.length)];
      }

      // Immediate win
      for (const col of cols) {
        if (isWinningDrop(col, 'p2')) return col;
      }

      // Immediate block
      for (const col of cols) {
        if (isWinningDrop(col, 'p1')) return col;
      }

      if (difficulty === 'medium') {
        return pickBestHeuristic(cols);
      }

      // hard: shallow minimax
      return minimaxMove(4).col;
    }

    function isWinningDrop(col, player) {
      const test = cloneGrid(grid);
      const row = getOpenRow(col, test);
      if (row === -1) return false;
      test[row][col] = player;
      return !!getWinningLine(row, col, player, test);
    }

    function pickBestHeuristic(cols) {
      const center = 3;
      const scored = cols.map(col => {
        const test = cloneGrid(grid);
        const row = getOpenRow(col, test);
        test[row][col] = 'p2';
        return {
          col,
          score: evaluateBoard(test, 'p2') - Math.abs(center - col) * 2 + Math.random()
        };
      });
      scored.sort((a, b) => b.score - a.score);
      return scored[0].col;
    }

    function minimaxMove(depth) {
      const result = minimax(cloneGrid(grid), depth, -Infinity, Infinity, true);
      if (result.col == null) {
        const cols = availableCols();
        return { col: cols[Math.floor(Math.random() * cols.length)] };
      }
      return result;
    }

    function minimax(state, depth, alpha, beta, maximizing) {
      const cols = availableCols(state);

      if (depth === 0 || cols.length === 0 || hasWinner(state, 'p1') || hasWinner(state, 'p2')) {
        return { score: scoreTerminal(state, depth) };
      }

      if (maximizing) {
        let best = { score: -Infinity, col: cols[0] };
        for (const col of cols) {
          const test = cloneGrid(state);
          const row = getOpenRow(col, test);
          test[row][col] = 'p2';
          const val = minimax(test, depth - 1, alpha, beta, false).score;
          if (val > best.score) best = { score: val, col };
          alpha = Math.max(alpha, val);
          if (beta <= alpha) break;
        }
        return best;
      }

      let best = { score: Infinity, col: cols[0] };
      for (const col of cols) {
        const test = cloneGrid(state);
        const row = getOpenRow(col, test);
        test[row][col] = 'p1';
        const val = minimax(test, depth - 1, alpha, beta, true).score;
        if (val < best.score) best = { score: val, col };
        beta = Math.min(beta, val);
        if (beta <= alpha) break;
      }
      return best;
    }

    function scoreTerminal(state, depth) {
      if (hasWinner(state, 'p2')) return 100000 + depth;
      if (hasWinner(state, 'p1')) return -100000 - depth;
      return evaluateBoard(state, 'p2') - evaluateBoard(state, 'p1');
    }

    function hasWinner(state, player) {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (state[r][c] !== player) continue;
          if (getWinningLine(r, c, player, state)) return true;
        }
      }
      return false;
    }

    function evaluateBoard(state, player) {
      const windows = [];

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          windows.push([state[r][c], state[r][c+1], state[r][c+2], state[r][c+3]]);
        }
      }

      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 3; r++) {
          windows.push([state[r][c], state[r+1][c], state[r+2][c], state[r+3][c]]);
        }
      }

      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          windows.push([state[r][c], state[r+1][c+1], state[r+2][c+2], state[r+3][c+3]]);
        }
      }

      for (let r = 3; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          windows.push([state[r][c], state[r-1][c+1], state[r-2][c+2], state[r-3][c+3]]);
        }
      }

      let score = 0;
      for (const window of windows) {
        const mine = window.filter(v => v === player).length;
        const empty = window.filter(v => v == null).length;
        if (mine === 4) score += 100;
        else if (mine === 3 && empty === 1) score += 5;
        else if (mine === 2 && empty === 2) score += 2;
      }
      return score;
    }

    modeEl.addEventListener('change', () => {
      difficultyRowEl.style.display = modeEl.value === 'ai' ? 'flex' : 'none';
      resetBoard();
    });

    difficultyEl.addEventListener('change', resetBoard);
    document.getElementById('new-game').addEventListener('click', resetBoard);
    document.getElementById('reset-scores').addEventListener('click', () => {
      scores = { p1: 0, p2: 0 };
      scoreP1El.textContent = '0';
      scoreP2El.textContent = '0';
      resetBoard();
    });

    resetBoard();
  </script>
</body>
</html>
